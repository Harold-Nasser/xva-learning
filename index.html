<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* ============================================================
   SM-2 ALGORITHM
   ============================================================ */
function sm2Next(card, quality) {
  // quality: 0=Again, 1=Hard, 2=Good, 3=Easy
  let { interval = 0, repetitions = 0, easeFactor = 2.5 } = card;
  if (quality < 1) {
    interval = 1; repetitions = 0;
  } else {
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    repetitions += 1;
    easeFactor = Math.max(1.3, easeFactor + 0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02));
  }
  const due = new Date();
  due.setDate(due.getDate() + interval);
  return { interval, repetitions, easeFactor, due: due.toISOString(), lastQuality: quality };
}

function isDue(card) {
  if (!card.due) return true;
  return new Date(card.due) <= new Date();
}

/* ============================================================
   STORAGE HELPERS
   ============================================================ */
const PROGRESS_KEY = 'learning_engine_progress_v1';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch { return {}; }
}
function saveProgress(p) {
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
}
function exportProgress(progress) {
  const blob = new Blob([JSON.stringify(progress, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `learning_progress_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   SAMPLE QUESTIONS (will be replaced by real JSON files)
   ============================================================ */
const SAMPLE_XVA = [
  { id:'xva_0001', section:'4.1', subtopic:'Definition', difficulty:'beginner', type:'definition', question:'What is counterparty credit risk in simple terms?', answer_short:'The risk that the party you entered a financial contract with will fail to fulfill their side of the agreement, for example by defaulting.', answer_long:'Counterparty credit risk arises when you enter into a financial contract with another entity. If that entity becomes unable or unwilling to meet their contractual obligations (typically because they default), you suffer a loss. This is different from market risk because the loss depends on the counterparty behavior.', why_it_matters:'Foundation of everything in XVA. Every adjustment (CVA, DVA, FVA) exists because two parties can fail each other.', common_traps:['Confusing counterparty risk with market risk','Thinking only the buyer has counterparty risk'], tags:['counterparty_risk','foundations'] },
  { id:'xva_0002', section:'4.1.1', subtopic:'Lending vs Counterparty Risk', difficulty:'beginner', type:'discrimination', question:'What are the two key aspects that differentiate counterparty risk from traditional lending risk?', answer_short:'1) Future value of the contract is uncertain (can be positive or negative). 2) Counterparty risk is bilateral — both parties have risk to each other.', answer_long:'In lending risk, the notional at risk is known with reasonable certainty and only ONE party takes the credit risk. In counterparty risk, the MTM at the future default date is highly uncertain. Since this value can be positive OR negative, each counterparty has risk to the other.', why_it_matters:'This bilateral nature is the foundation of CVA AND DVA. Without understanding this, the rest of XVA will not make sense.', common_traps:['Assuming exposure equals notional like a loan','Forgetting risk is bidirectional'], tags:['counterparty_risk','bilateral','MTM'] },
  { id:'xva_0003', section:'4.1.2', subtopic:'Settlement Risk', difficulty:'beginner', type:'discrimination', question:'What is the difference between pre-settlement risk and settlement risk?', answer_short:'Pre-settlement risk: counterparty defaults before contract matures. Settlement risk: counterparty defaults during the settlement process due to timing differences.', answer_long:'Pre-settlement risk dominates for long-dated derivatives like swaps, where the counterparty could default any time over the life of the trade. Settlement risk arises only at settlement dates when one party pays before the other — the classic Herstatt risk example.', why_it_matters:'Tells you which risk management tool to use: CVA/collateral for pre-settlement, CLS/DVP infrastructure for settlement.', common_traps:['Underestimating settlement risk for FX trades','Assuming CLS eliminates all settlement risk'], tags:['settlement_risk','pre_settlement','Herstatt'] },
  { id:'xva_0004', section:'4.2.1', subtopic:'MTM and Replacement Cost', difficulty:'intermediate', type:'concept', question:'Why is replacement cost a better measure than MTM in a default scenario?', answer_short:'Because replacing a defaulted trade includes real costs like bid-offer spreads and illiquidity premiums that MTM does not capture.', answer_long:'MTM is the mark-to-market value of remaining cashflows. But replacing a defaulted contract means finding a new counterparty, paying bid-offer spreads (often wide in stressed markets), and potentially accepting worse terms if the original contract was non-standard. Replacement cost is therefore higher than MTM in most stress scenarios.', why_it_matters:'ISDA documentation references replacement costs, not MTM, in close-out mechanics — so your loss model must account for this.', common_traps:['Using MTM as a proxy for losses without bid-offer adjustment','Ignoring liquidity premiums in stressed markets'], tags:['MTM','replacement_cost','close_out'] },
  { id:'xva_0005', section:'4.3.2', subtopic:'CVA Introduction', difficulty:'intermediate', type:'definition', question:'What does CVA represent and why has risk-neutral pricing become the market standard?', answer_short:'CVA is the market value of counterparty credit risk — the expected loss from a counterparty defaulting, priced using risk-neutral (market-implied) default probabilities.', answer_long:'CVA converts counterparty risk into a price adjustment. Two approaches exist: actuarial (historical PD, used as a reserve) and risk-neutral (credit spread implied PD, MTM-based). Risk-neutral became dominant due to: 1) accounting standards IFRS 13 requiring exit price, 2) Basel III using credit spreads for CVA capital, 3) market practice convergence from larger banks.', why_it_matters:'Understanding WHY risk-neutral became standard tells you how to defend CVA numbers to auditors, regulators, and traders.', common_traps:['Using historical PD for CVA in a risk-neutral framework','Confusing CVA reserve with CVA MTM'], tags:['CVA','risk_neutral','accounting'] },
];

const SAMPLE_COM = [
  { id:'com_0001', section:'3.1', subtopic:'Forward Curve', difficulty:'beginner', type:'definition', question:'What is the difference between contango and backwardation in a commodity forward curve?', answer_short:'Contango: futures price > spot price (upward sloping curve). Backwardation: futures price < spot price (downward sloping curve).', answer_long:'In contango, the market prices future delivery higher than today — usually reflecting storage costs and financing. In backwardation, the market prices future delivery lower than today — often because of high immediate demand or supply tightness creating a convenience yield.', why_it_matters:'The shape of the forward curve drives P&L on rolling positions. A long futures position in contango loses on rolls; in backwardation it gains.', common_traps:['Thinking contango always means prices will rise','Ignoring convenience yield in backwardated markets'], tags:['contango','backwardation','forward_curve'] },
  { id:'com_0002', section:'3.2', subtopic:'Basis Risk', difficulty:'intermediate', type:'definition', question:'What is basis risk in commodity trading and why is it hard to hedge perfectly?', answer_short:'Basis risk is the difference between the price of a commodity at the specific location/time you need and the benchmark futures price. It cannot be perfectly hedged because futures track benchmarks, not local conditions.', answer_long:'Commodity prices differ by location (transport costs, pipeline constraints), quality (sulfur content, API gravity), and time (delivery date mismatch). A Texas oil producer hedging WTI futures still faces Houston/WTI basis risk. Even within a delivery hub, timing basis exists between your delivery date and the futures expiry.', why_it_matters:'Basis risk is the main reason commodity hedges are imperfect. Underestimating it leads to hedging P&L surprises that can be as large as the original risk.', common_traps:['Assuming futures perfectly hedge physical positions','Ignoring location basis in pipelines and terminals'], tags:['basis_risk','hedging','physical_commodity'] },
];

/* ============================================================
   MAIN APP
   ============================================================ */
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
  const [domain, setDomain] = useState('xva');
  const [tab, setTab] = useState('study');
  const [progress, setProgress] = useState(loadProgress);
  const [qIdx, setQIdx] = useState(0);
  const [showAnswer, setShowAnswer] = useState(false);
  const [userAnswer, setUserAnswer] = useState('');
  const [confidence, setConfidence] = useState(3);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }, [theme]);

  const questions = domain === 'xva' ? SAMPLE_XVA : SAMPLE_COM;
  const domainKey = domain;

  const getDomainProgress = () => progress[domainKey] || {};
  const updateCardProgress = (questionId, updates) => {
    const newP = { ...progress, [domainKey]: { ...getDomainProgress(), [questionId]: { ...(getDomainProgress()[questionId] || {}), ...updates } } };
    setProgress(newP);
    saveProgress(newP);
  };

  const dueQuestions = questions.filter(q => {
    const cp = getDomainProgress()[q.id] || {};
    return isDue(cp);
  });

  const masteredCount = questions.filter(q => {
    const cp = getDomainProgress()[q.id] || {};
    return cp.repetitions >= 3 && (cp.lastQuality || 0) >= 2;
  }).length;

  const totalAnswered = Object.values(getDomainProgress()).filter(v => v.repetitions > 0).length;
  const totalGood = Object.values(getDomainProgress()).filter(v => (v.lastQuality || 0) >= 2).length;
  const accuracy = totalAnswered > 0 ? Math.round(totalGood / totalAnswered * 100) : 0;

  const currentDue = dueQuestions[qIdx % Math.max(1, dueQuestions.length)];

  function handleSM2(quality) {
    if (!currentDue) return;
    const cp = getDomainProgress()[currentDue.id] || {};
    const updated = sm2Next(cp, quality);
    updateCardProgress(currentDue.id, updated);
    setShowAnswer(false);
    setUserAnswer('');
    setConfidence(3);
    setQIdx(i => (i + 1) % Math.max(1, dueQuestions.length));
  }

  function handleSkip() {
    setShowAnswer(false);
    setUserAnswer('');
    setConfidence(3);
    setQIdx(i => (i + 1) % Math.max(1, dueQuestions.length));
  }

  const confLabels = { 1:'Very low', 2:'Low', 3:'Moderate', 4:'High', 5:'Very high' };

  const progress_pct = Math.round(masteredCount / Math.max(1, questions.length) * 100);

  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        setProgress(data);
        saveProgress(data);
        alert('Progress imported successfully!');
      } catch { alert('Invalid file format.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  return (
    <>
      <header className="header">
        <div className="header-inner">
          <div className="logo">Learning <span>Engine</span></div>
          <div className="domain-switcher">
            <button className={`domain-btn xva ${domain==='xva'?'active':''}`} onClick={()=>{setDomain('xva');setQIdx(0);setShowAnswer(false);}}>XVA</button>
            <button className={`domain-btn com ${domain==='com'?'active':''}`} onClick={()=>{setDomain('com');setQIdx(0);setShowAnswer(false);}}>Commodities</button>
          </div>
          <div className="header-right">
            <div className="streak-badge">🔥 12 days</div>
            <button className="icon-btn" onClick={()=>setTheme(t=>t==='light'?'dark':'light')} title="Toggle theme">
              {theme==='light'?'🌙':'☀️'}
            </button>
          </div>
        </div>
      </header>

      <div className="app">
        {/* Progress bar */}
        <div className="progress-wrap">
          <div className="progress-fill" style={{width: progress_pct+'%'}}/>
        </div>

        {/* Tabs */}
        <div className="tabs">
          {[['study','📚','Study'],['brief','🎧','Brief'],['stats','📊','Stats']].map(([id,ico,label])=>(
            <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>
              {ico} {label}
            </button>
          ))}
        </div>

        {/* Import/Export bar */}
        <div className="io-bar">
          <button className="io-btn" onClick={()=>exportProgress(progress)}>⬇ Export progress</button>
          <label className="io-btn" style={{cursor:'pointer'}}>
            ⬆ Import progress
            <input type="file" accept=".json" style={{display:'none'}} onChange={handleImport}/>
          </label>
          <button className="io-btn" onClick={()=>window.open('https://notebooklm.google.com','_blank')}>🎙 Open NotebookLM</button>
        </div>

        {/* === STUDY TAB === */}
        {tab === 'study' && (
          <>
            <div className="stats-grid">
              <div className="stat-card"><div className="stat-label">Mastered</div><div className="stat-value">{masteredCount}</div></div>
              <div className="stat-card"><div className="stat-label">Due today</div><div className="stat-value">{dueQuestions.length}</div></div>
              <div className="stat-card"><div className="stat-label">Accuracy</div><div className="stat-value">{totalAnswered > 0 ? accuracy+'%' : '—'}</div></div>
              <div className="stat-card"><div className="stat-label">Total</div><div className="stat-value">{questions.length}</div></div>
            </div>

            {dueQuestions.length === 0 ? (
              <div className="empty">
                <div className="empty-title">All caught up! 🎉</div>
                <div className="empty-sub">No questions due right now. Come back tomorrow to keep your streak.</div>
              </div>
            ) : currentDue ? (
              <div className="card">
                <div className="card-meta">
                  <div className="badges">
                    <span className={`badge badge-${currentDue.difficulty}`}>{currentDue.difficulty}</span>
                    <span className="badge badge-type">{currentDue.type}</span>
                    <span className="q-section">{currentDue.section}</span>
                  </div>
                  <span className="q-counter">{(qIdx%dueQuestions.length)+1} / {dueQuestions.length} due</span>
                </div>

                <div className="question-text">{currentDue.question}</div>

                {!showAnswer && (
                  <>
                    <div className="predict-hint">💡 Write your prediction before revealing</div>
                    <textarea value={userAnswer} onChange={e=>setUserAnswer(e.target.value)} placeholder="Your answer here..."/>
                    <div className="conf-row">
                      <span className="conf-label-text">Confidence</span>
                      <input type="range" min="1" max="5" step="1" value={confidence} onChange={e=>setConfidence(Number(e.target.value))}/>
                      <span className="conf-value">{confLabels[confidence]}</span>
                    </div>
                    <div className="action-row">
                      <button className="btn" onClick={handleSkip}>Skip</button>
                      <button className="btn btn-primary" onClick={()=>setShowAnswer(true)}>Reveal answer →</button>
                    </div>
                  </>
                )}

                {showAnswer && (
                  <>
                    <div className="answer-box">
                      <div className="answer-label">Answer</div>
                      <div className="answer-short">{currentDue.answer_short}</div>
                      <div className="answer-long">{currentDue.answer_long}</div>
                      {currentDue.why_it_matters && <div className="why-matters">💼 {currentDue.why_it_matters}</div>}
                      {currentDue.common_traps?.length > 0 && (
                        <div className="traps">
                          {currentDue.common_traps.map((t,i)=>(
                            <div key={i} className="trap-item">⚠ {t}</div>
                          ))}
                        </div>
                      )}
                    </div>
                    <div style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>How well did you know this?</div>
                    <div className="sm2-row">
                      <button className="sm2-btn sm2-again" onClick={()=>handleSM2(0)}>Again<br/><span style={{fontSize:10,opacity:0.7}}>Tomorrow</span></button>
                      <button className="sm2-btn sm2-hard" onClick={()=>handleSM2(1)}>Hard<br/><span style={{fontSize:10,opacity:0.7}}>+3 days</span></button>
                      <button className="sm2-btn sm2-good" onClick={()=>handleSM2(2)}>Good<br/><span style={{fontSize:10,opacity:0.7}}>+7 days</span></button>
                      <button className="sm2-btn sm2-easy" onClick={()=>handleSM2(3)}>Easy<br/><span style={{fontSize:10,opacity:0.7}}>+14 days</span></button>
                    </div>
                  </>
                )}
              </div>
            ) : null}
          </>
        )}

        {/* === BRIEF TAB === */}
        {tab === 'brief' && (
          <>
            <div className="brief-card">
              <div className="brief-header">
                <div>
                  <div className="brief-title">Today's morning brief</div>
                  <div className="brief-meta" style={{marginTop:4}}>Generated at 6:00 AM · Gemini AI · {domain==='xva'?'XVA':'Commodities'}</div>
                </div>
              </div>
              <div className="brief-body">
                {domain==='xva'
                  ? "Yesterday you struggled with DVA vs CVA discrimination. Today's brief walks through 3 real trade scenarios where the asymmetry matters: a long-dated swap with a high-yield counterparty, a collateralised hedge, and a wrong-way risk situation. Focus on why the sign flips when you look from the other side of the trade."
                  : "Today we cover basis risk — the core challenge in physical commodity hedging. You'll see how location, quality, and timing differences create residual risk even when you're 'fully hedged' on paper. Three examples: WTI vs Midland crude, Henry Hub vs local gas, and power forward basis in ERCOT."
                }
              </div>
              <div className="audio-player">
                <button className="play-btn">▶</button>
                <div className="audio-info">
                  <div className="audio-title">Audio brief — NotebookLM podcast</div>
                  <div className="audio-bar"><div className="audio-fill"/></div>
                </div>
                <span className="audio-time">1:23 / 4:08</span>
              </div>
              <div style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>To add your own audio: generate a podcast in NotebookLM and link it here.</div>
              <button className="btn" style={{fontSize:12}} onClick={()=>window.open('https://notebooklm.google.com','_blank')}>🎙 Open NotebookLM →</button>
              <div className="concept-tags" style={{marginTop:16}}>
                {(domain==='xva'
                  ? ['CVA formula','DVA asymmetry','Bilateral exposure','Risk-neutral PD']
                  : ['Basis risk','Forward curve','Roll yield','Physical delivery']
                ).map(t=><span key={t} className="concept-tag">{t}</span>)}
              </div>
            </div>

            <div className="brief-card" style={{opacity:0.6}}>
              <div className="section-title">Previous briefs</div>
              <div className="hard-item"><span>Yesterday — Counterparty risk foundations</span><span className="acc-good">✓ Done</span></div>
              <div className="hard-item"><span>2 days ago — Netting & close-out</span><span className="acc-good">✓ Done</span></div>
              <div className="hard-item"><span>3 days ago — Collateral mechanics</span><span className="acc-good">✓ Done</span></div>
            </div>
          </>
        )}

        {/* === STATS TAB === */}
        {tab === 'stats' && (
          <>
            <div className="card">
              <div className="section-title">30-day progress</div>
              <div className="chart-wrap">
                <svg width="100%" height="120" viewBox="0 0 700 120">
                  <polyline className="chart-line"
                    points="20,100 70,90 120,80 170,72 220,60 270,55 320,42 370,38 420,30 470,25 520,20 570,18 620,14 680,10"/>
                  <line x1="10" y1="110" x2="690" y2="110" stroke="var(--border2)" strokeWidth="1"/>
                </svg>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text3)',fontFamily:'DM Mono, monospace'}}>
                <span>Day 1</span><span>Today</span>
              </div>
            </div>

            <div className="card">
              <div className="section-title">Most difficult concepts</div>
              <div className="hard-list">
                {(domain==='xva' ? [
                  ['Wrong-way risk modelling','42%','bad'],
                  ['FVA vs DVA overlap','51%','bad'],
                  ['Close-out amount conventions','63%','ok'],
                  ['OIS discounting mechanics','71%','ok'],
                  ['Collateral haircut impact','78%','good'],
                ] : [
                  ['Basis risk quantification','45%','bad'],
                  ['Convenience yield theory','58%','bad'],
                  ['Roll yield calculation','67%','ok'],
                  ['EFP mechanics','72%','ok'],
                  ['NYMEX delivery specs','80%','good'],
                ]).map(([name,acc,cls])=>(
                  <div key={name} className="hard-item">
                    <span style={{fontSize:13}}>{name}</span>
                    <span className={`acc-${cls}`}>{acc}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="stats-grid" style={{marginTop:0}}>
              <div className="stat-card"><div className="stat-label">Total reviewed</div><div className="stat-value">{totalAnswered}</div></div>
              <div className="stat-card"><div className="stat-label">Study streak</div><div className="stat-value">12</div></div>
              <div className="stat-card"><div className="stat-label">Mastered</div><div className="stat-value">{masteredCount}</div></div>
              <div className="stat-card"><div className="stat-label">Accuracy</div><div className="stat-value">{totalAnswered>0?accuracy+'%':'—'}</div></div>
            </div>
          </>
        )}
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
